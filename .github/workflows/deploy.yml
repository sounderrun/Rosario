name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

# The job only reads the repo; the Cloudflare token does the deploying.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment secrets reach only jobs from branches its rules allow (main).
    environment:
      name: production
      url: https://rosario.osario.workers.dev
    steps:
      # Actions pinned to full commit SHAs: a moved tag can't swap in new code.
      # Dependabot updates the SHA and the version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # No install scripts: the usual way a compromised package runs code.
      - run: npm ci --ignore-scripts
      - run: npm run deploy
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
